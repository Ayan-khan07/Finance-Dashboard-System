# ---------------------------------------------------------------------------
# Every secret / environment-specific value comes from an environment variable.
# Required (no default, app fails fast if missing):
#   DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET, GEMINI_API_KEY
# Optional tuning knobs have safe defaults.
# ---------------------------------------------------------------------------
spring:
  application:
    name: finance-dashboard

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: FinanceHikariPool
      # Free-tier cloud Postgres allows very few connections; keep the pool small.
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: 30000        # ms; generous so a cold-start (Neon scale-to-zero) can wake up
      validation-timeout: 5000
      idle-timeout: 120000             # retire idle connections before the provider drops them
      max-lifetime: 300000             # 5 min, below typical server/proxy idle limits
      keepalive-time: 60000
      leak-detection-threshold: 60000

  jpa:
    open-in-view: false                # no lazy loading in the web layer; forces explicit fetching in services
    hibernate:
      # update = convenient for first run. Switch to "validate" once you adopt Flyway/Liquibase.
      ddl-auto: ${DDL_AUTO:update}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 25
        order_inserts: true
        order_updates: true
        format_sql: false

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100             # clients cannot request unbounded pages
        one-indexed-parameters: false  # page=0 is the first page

  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  shutdown: graceful
  compression:
    enabled: true
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:true}
    operations-sorter: method

app:
  jwt:
    # Base64-encoded key, minimum 256 bits once decoded. Generate with: openssl rand -base64 48
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  gemini:
    api-key: ${GEMINI_API_KEY}
    base-url: https://generativelanguage.googleapis.com/v1beta
    model: ${GEMINI_MODEL:gemini-2.5-flash}
    connect-timeout-ms: ${GEMINI_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${GEMINI_READ_TIMEOUT_MS:15000}
  cors:
    # Comma-separated list of browser origins allowed to call the API.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  bootstrap-admin:
    # First-run only: creates one ADMIN when the users table is empty AND a password is set.
    username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
    email: ${BOOTSTRAP_ADMIN_EMAIL:admin@example.com}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}

logging:
  level:
    root: INFO
    com.finance.dashboard: ${APP_LOG_LEVEL:INFO}
    org.hibernate.SQL: WARN
